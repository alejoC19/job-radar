name: Job Radar - Corrida diaria

# Corre el bot 2 veces por dia (9 y 18 hs Argentina, UTC-3 todo el año, sin
# horario de verano) y tambien se puede disparar a mano para probar. Persiste
# data/seen.json en el repo para no repetir avisos ya notificados entre
# corridas (los runners de Actions son efimeros).
on:
  schedule:
    - cron: "0 12,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr job-radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m job_radar.main

      - name: Persistir avisos ya notificados
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore: actualiza avisos notificados [skip ci]"
          git push
